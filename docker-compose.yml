services:
  educlaw-db:
    image: m.daocloud.io/docker.io/library/postgres:17
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  educlaw-server:
    build:
      context: .
      dockerfile: educlaw-server/Dockerfile
    image: educlaw-server:latest
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET:-local-dev-jwt-secret-not-for-production}
      - INVITE_CODE=${INVITE_CODE}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_BASELINE_MODEL=${LLM_BASELINE_MODEL}
      - CONVERSATION_EVAL_BASE_URL=${CONVERSATION_EVAL_BASE_URL:-http://host.docker.internal:8090}
      - CONVERSATION_EVAL_SCENES_DIR=${CONVERSATION_EVAL_SCENES_DIR:-/data/educlaw-eval-scenes}
      - APP_ORIGIN=${APP_ORIGIN:-http://eduskill.localhost}
      - SEED_USERS=${SEED_USERS:-false}
      - SEED_USER_NAMES=${SEED_USER_NAMES:-}
      - SEED_USER_PASSWORD=${SEED_USER_PASSWORD:-}
      - PORT=3000
    volumes:
      - ${CONVERSATION_EVAL_SCENES_DIR:-/data/educlaw-eval-scenes}:${CONVERSATION_EVAL_SCENES_DIR:-/data/educlaw-eval-scenes}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      educlaw-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - auth-net

  educlaw-web:
    build:
      context: .
      dockerfile: educlaw-web/Dockerfile
    image: educlaw-web:latest
    environment:
      - API_UPSTREAM=http://educlaw-server:3000
    depends_on:
      - educlaw-server
    restart: unless-stopped
    networks:
      - default
      - auth-net

networks:
  auth-net:
    name: ${AUTH_NETWORK_NAME:-auth-service_internal-net}
    external: true

volumes:
  postgres-data:
