services:
  educlaw-postgres:
    image: postgres:16-alpine
    container_name: educlaw-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-educlawlite}
      POSTGRES_USER: ${POSTGRES_USER:-educlawlite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-educlawlite}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - educlaw-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-educlawlite} -d ${POSTGRES_DB:-educlawlite}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  educlaw-server:
    build:
      context: .
      dockerfile: educlaw-server/Dockerfile
    image: educlaw-server:latest
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-educlawlite}:${POSTGRES_PASSWORD:-educlawlite}@educlaw-postgres:5432/${POSTGRES_DB:-educlawlite}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_BASELINE_MODEL=${LLM_BASELINE_MODEL}
      - APP_ORIGIN=${APP_ORIGIN:-http://localhost}
      - SEED_USERS=${SEED_USERS:-false}
      - SEED_USER_NAMES=${SEED_USER_NAMES:-}
      - SEED_USER_PASSWORD=${SEED_USER_PASSWORD:-}
      - PORT=3000
    ports:
      - "127.0.0.1:${SERVER_PORT:-3000}:3000"
    depends_on:
      educlaw-postgres:
        condition: service_healthy
    restart: unless-stopped

  educlaw-web:
    build:
      context: .
      dockerfile: educlaw-web/Dockerfile
    image: educlaw-web:latest
    ports:
      - "${WEB_PORT:-80}:80"
    environment:
      - API_UPSTREAM=http://educlaw-server:3000
    depends_on:
      - educlaw-server
    restart: unless-stopped

volumes:
  educlaw-postgres-data:
