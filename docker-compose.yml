name: educlaw

services:
  educlaw-db:
    image: m.daocloud.io/docker.io/library/postgres:17
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  educlaw-server:
    build:
      context: .
      dockerfile: educlaw-server/Dockerfile
    image: educlaw-server:latest
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_BASELINE_MODEL=${LLM_BASELINE_MODEL}
      - APP_ORIGIN=${APP_ORIGIN:-http://eduskill.localhost}
      - PORT=3000
    depends_on:
      educlaw-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      default: {}
      auth-net:
        aliases:
          - educlaw-server

  educlaw-web:
    build:
      context: .
      dockerfile: educlaw-web/Dockerfile
    image: educlaw-web:latest
    environment:
      - API_UPSTREAM=http://eduskill-server:3000
      - AUTH_UPSTREAM=${AUTH_UPSTREAM:-http://auth-backend:3000}
    depends_on:
      - educlaw-server
    restart: unless-stopped
    networks:
      default: {}
      auth-net:
        aliases:
          - educlaw-web

networks:
  auth-net:
    name: ${AUTH_NETWORK_NAME:-auth-service_internal-net}
    external: true

volumes:
  postgres-data:
