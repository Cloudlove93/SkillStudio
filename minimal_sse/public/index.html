<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minimal SSE</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <div class="header">
          <div>
            <p class="eyebrow">EventSource demo</p>
            <h1>Minimal SSE</h1>
          </div>
          <span id="status" class="status">Disconnected</span>
        </div>

        <div class="actions">
          <button id="connect" type="button">Connect</button>
          <button id="disconnect" type="button" class="secondary">Disconnect</button>
          <button id="clear" type="button" class="secondary">Clear</button>
        </div>

        <ol id="events" class="events" aria-live="polite"></ol>
      </section>
    </main>

    <script src="/main.js"></script>
  </body>
</html>
