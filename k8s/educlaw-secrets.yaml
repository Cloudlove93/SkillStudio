apiVersion: v1
kind: Secret
metadata:
  name: educlaw-secrets
  namespace: educlaw
  labels:
    app: educlaw
type: Opaque
stringData:
  # ─── 数据库 — 使用阿里云 RDS PostgreSQL ───
  # EduClaw 业务库（需先在 RDS 实例上 CREATE DATABASE educlawlite）
  DATABASE_URL: "postgres://educlawlite:<替换为educlawlite密码>@pgm-0jl6co258wue9h01.pg.rds.aliyuncs.com:5432/educlawlite"

  # ─── JWT / 邀请码 ───
  JWT_SECRET: "<替换为64位随机hex字符串>"
  INVITE_CODE: "EduSkill2026"

  # ─── LLM ───
  LLM_API_KEY: "<替换为Moonshot API Key>"

  # ─── 阿里云短信（auth-backend 用）───
  ALIYUN_ACCESS_KEY_ID: "<替换为RAM AccessKey ID>"
  ALIYUN_ACCESS_KEY_SECRET: "<替换为RAM AccessKey Secret>"
  ALIYUN_SMS_SIGN_NAME: "<替换为短信签名>"
  ALIYUN_SMS_TEMPLATE_CODE: "<替换为短信模板Code>"
