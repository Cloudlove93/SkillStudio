apiVersion: apps/v1
kind: Deployment
metadata:
  name: educlaw-server
  namespace: educlaw
  labels:
    app: educlaw-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: educlaw-server
  template:
    metadata:
      labels:
        app: educlaw-server
    spec:
      imagePullSecrets:
        - name: mi
      containers:
        - name: educlaw-server
          image: crpi-a4e25wq5oddt3z3b.cn-shanghai.personal.cr.aliyuncs.com/educlaw/educlaw-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: educlaw-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: educlaw-config
                  key: PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: educlaw-secrets
                  key: DATABASE_URL
            - name: INVITE_CODE
              valueFrom:
                secretKeyRef:
                  name: educlaw-secrets
                  key: INVITE_CODE
            - name: LLM_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: educlaw-config
                  key: LLM_BASE_URL
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: educlaw-secrets
                  key: LLM_API_KEY
            - name: LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: educlaw-config
                  key: LLM_MODEL
            - name: LLM_BASELINE_MODEL
              valueFrom:
                configMapKeyRef:
                  name: educlaw-config
                  key: LLM_BASELINE_MODEL
            - name: LLM_TIMEOUT_MS
              valueFrom:
                configMapKeyRef:
                  name: educlaw-config
                  key: LLM_TIMEOUT_MS
            - name: LLM_NETWORK_RETRIES
              valueFrom:
                configMapKeyRef:
                  name: educlaw-config
                  key: LLM_NETWORK_RETRIES
            - name: APP_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: educlaw-config
                  key: APP_ORIGIN
          volumeMounts:
            - mountPath: /data/educlaw-eval-scenes
              name: eval-scenes
            - mountPath: /etc/localtime
              name: volume-localtime
          resources:
            limits:
              cpu: "2"
              ephemeral-storage: 30Gi
              memory: 2Gi
            requests:
              cpu: 500m
              ephemeral-storage: 10Gi
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
      volumes:
        - name: eval-scenes
          persistentVolumeClaim:
            claimName: educlaw-eval-scenes
        - name: volume-localtime
          hostPath:
            path: /etc/localtime
            type: ''
---
apiVersion: v1
kind: Service
metadata:
  name: educlaw-server
  namespace: educlaw
  labels:
    app: educlaw-server
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: educlaw-server
