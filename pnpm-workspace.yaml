packages:
  - educlaw-shared
  - educlaw-server
  - educlaw-web
  - openagent
allowBuilds:
  esbuild: true
  # protobufjs 的 postinstall 只做版本方案校验，无副作用。
  protobufjs: true
  # @google/genai 的 prepare 脚本在发布包中缺少 scripts/prepare.js，禁止执行。
  '@google/genai': false
overrides:
  nanoid: 3.3.18
  postcss: 8.5.18
  # 依赖审计修复：锁定到已修复版本，避免传递依赖回退到漏洞版本。
  qs: 6.16.1
  '@xmldom/xmldom': 0.8.15
  '@ai-sdk/provider-utils': 4.0.33
  proxy-addr: 2.0.8
  body-parser: 2.4.0
  postcss-selector-parser: 6.1.5
  zod: 4.6.6
  katex: 0.18.2
